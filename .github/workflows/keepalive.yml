name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity (it happened to Build Newspaper and CodeQL on 2026-10-01).
# Calling the "enable workflow" API resets that inactivity timer, so this
# job re-enables every scheduled workflow once a week, including itself.
# No commits are made. See:
# https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/disabling-and-enabling-a-workflow

on:
  schedule:
    - cron: "17 5 * * 1" # Weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in build-newspaper.yml codeql.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable"
            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq .state)
            echo "$wf: $state"
          done
